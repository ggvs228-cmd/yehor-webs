<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/styles.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f7f1ea;color:#3b2f2b}
  .og{position:relative;height:100%;padding:64px 80px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .og-top{font:400 18px/1 "Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#a05a4c;display:flex;justify-content:space-between}
  h1{font:400 92px/.95 "Instrument Serif",serif;letter-spacing:-.015em;margin:0;max-width:15ch}
  h1 em{font-style:italic;color:#a05a4c}
  .og-foot{font:400 17px/1 "Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#76675f;display:flex;justify-content:space-between;border-top:1px solid #e7dbd1;padding-top:22px}
  svg{position:absolute;right:80px;top:150px;width:260px;height:260px}
  circle,path{fill:none;stroke:#a05a4c;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body><div class="og">
  <div class="og-top"><span>Yehor · Webs para negocios</span><span>Webs desde 600 €</span></div>
  <h1>Hago webs para <em>estudios de belleza</em> y pequeños negocios de Barcelona.</h1>
  <div class="og-foot"><span>Reservas por WhatsApp · Ficha de Google</span><span>Barcelona</span></div>
  <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56"/><path d="M36 30 60 64 84 30M60 64v28" stroke-width="3"/></svg>
</div></body></html>
